<style>
  :root {
    --bg:      #f5f2ed;
    --card:    #ffffff;
    --border:  #e8e5e0;
    --text:    #111111;
    --muted:   #999990;
    --subtle:  #666660;
    --truth:   #16a34a;
    --cb:      #ea580c;
    --rb:      #dc2626;
    --radius:  10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; font-family: Georgia, serif; }
  #app { max-width: 480px; margin: 0 auto; padding: 0 20px 60px; }

  /* ── Masthead ── */
  .masthead { text-align: center; padding: 32px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .eyebrow { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 2.5px; color: var(--subtle); text-transform: uppercase; margin-bottom: 8px; transition: opacity 0.4s ease; min-height: 16px; }
  .masthead h1 { font-family: Georgia, serif; font-size: 28px; font-weight: bold; letter-spacing: -0.5px; color: var(--text); cursor: default; }
  .masthead h1.clickable { cursor: pointer; }

  /* ── Cards ── */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; }
  .card-label { font-family: 'Courier New', monospace; font-size: 9.5px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }

  /* ── Buttons ── */
  button { cursor: pointer; font-family: inherit; border: none; }
  .btn-primary { width: 100%; padding: 13px; background: #111; color: white; border-radius: var(--radius); font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 1px; border: none; cursor: pointer; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary.success { background: var(--truth); }
  .btn-secondary { width: 100%; padding: 13px; background: transparent; color: var(--subtle); border-radius: var(--radius); font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 0.5px; border: 1px solid var(--border); cursor: pointer; margin-top: 8px; }
  .btn-secondary:hover { border-color: #aaa; }
  .btn-back { background: none; border: none; color: var(--muted); font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.5px; padding: 0; margin-top: 20px; cursor: pointer; }

  /* ── URL Input ── */
  .url-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .url-input { flex: 1; font-family: Georgia, serif; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 14px; background: var(--card); color: var(--text); outline: none; }
  .url-input:focus { border-color: #aaa; }
  .detect-btn { background: #111; color: white; border: none; border-radius: var(--radius); padding: 13px 18px; font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 0.5px; cursor: pointer; flex-shrink: 0; }
  .detect-btn:hover { opacity: 0.88; }

  /* ── OR divider ── */
  .or-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; }
  .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .or-text { font-family: 'Courier New', monospace; font-size: 9.5px; letter-spacing: 2px; color: var(--muted); }

  /* ── Prominent upload zone ── */
  .upload-zone-card { background: var(--card); border: 1.5px dashed #c4bdb4; border-radius: var(--radius); padding: 28px 20px 22px; text-align: center; cursor: pointer; width: 100%; display: block; transition: border-color 0.15s, background 0.15s; }
  .upload-zone-card:hover, .upload-zone-card.drag-over { border-color: #888; background: #f0ede8; }
  .upload-zone-icon { font-size: 30px; display: block; margin-bottom: 10px; }
  .upload-zone-title { font-family: Georgia, serif; font-size: 16px; color: var(--text); margin-bottom: 8px; display: block; }
  .upload-zone-hint { font-family: 'Courier New', monospace; font-size: 10px; color: var(--muted); line-height: 1.75; letter-spacing: 0.3px; display: block; }
  /* Compact upload (access/format screens) */
  .upload-label { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Courier New', monospace; font-size: 12px; color: var(--muted); letter-spacing: 0.5px; border: 1px dashed #d8d0c6; border-radius: var(--radius); padding: 14px 16px; cursor: pointer; width: 100%; }
  .upload-label:hover { border-color: #aaa; color: var(--subtle); }

  /* ── Thumbnail strip ── */
  .thumb-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: thin; }
  .thumb-item { flex-shrink: 0; position: relative; height: 88px; border-radius: 7px; border: 1px solid var(--border); overflow: hidden; }
  .thumb-item img { height: 88px; width: auto; display: block; }
  .thumb-remove { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.65); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 13px; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
  .thumb-add { flex-shrink: 0; height: 88px; width: 60px; border: 1px dashed #d8d0c6; border-radius: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 22px; font-family: 'Courier New', monospace; }
  .thumb-add:hover { border-color: #aaa; color: var(--subtle); }
  .thumb-count { font-family: 'Courier New', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 8px; }

  /* ── Counter ── */
  .count-line { text-align: center; font-family: 'Courier New', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.5px; margin: 20px 0 24px; }
  .count-num { color: var(--subtle); }

  /* ── Hall of Verdicts ── */
  .hall-label { font-family: 'Courier New', monospace; font-size: 9.5px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .hall-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .verdict-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; cursor: pointer; transition: border-color 0.15s; }
  .verdict-card:hover { border-color: #aaa; }
  .verdict-card-pub { font-family: 'Courier New', monospace; font-size: 8px; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
  .verdict-card-hl { font-family: Georgia, serif; font-size: 11px; font-style: italic; color: #555; line-height: 1.45; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .verdict-card-scores { display: flex; gap: 5px; font-family: 'Courier New', monospace; font-size: 9px; font-weight: bold; }

  /* ── Score Explainer ── */
  .explainer { margin-top: 28px; }
  .explainer-label { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; }
  .explainer-row { display: flex; gap: 12px; margin-bottom: 14px; }
  .explainer-bar { width: 3px; border-radius: 2px; flex-shrink: 0; min-height: 40px; }
  .explainer-title { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 1.2px; font-weight: bold; margin-bottom: 3px; text-transform: uppercase; }
  .explainer-desc { font-size: 12.5px; color: #777; line-height: 1.55; }

  /* ── Spinner ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 32px; height: 32px; border: 2.5px solid var(--border); border-top-color: #333; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  .phase-text { font-family: 'Courier New', monospace; font-size: 12px; color: var(--muted); letter-spacing: 0.5px; text-align: center; }
  .analysing-wrap { text-align: center; padding: 40px 0; }

  /* ── Format / access states ── */
  .state-tag { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; border-radius: 4px; padding: 3px 9px; display: inline-block; margin-bottom: 12px; font-weight: bold; }
  .state-body { font-size: 14px; color: #444; line-height: 1.65; }
  .state-body-sm { font-size: 13px; color: #888; line-height: 1.6; margin-top: 10px; }

  /* ── Result: verdict ── */
  .verdict-quote { font-family: Georgia, serif; font-size: 16px; color: var(--text); line-height: 1.6; font-style: italic; min-height: 1.6em; }
  .headline-quote { font-family: Georgia, serif; font-size: 14px; font-style: italic; color: #777; margin-bottom: 4px; line-height: 1.5; }
  .publication-tag { font-family: 'Courier New', monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-bottom: 20px; }

  /* ── Score cards ── */
  .score-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; user-select: none; }
  .score-card-head { display: flex; align-items: center; justify-content: space-between; }
  .score-card-left { display: flex; align-items: center; gap: 10px; }
  .score-type { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 1.5px; font-weight: bold; text-transform: uppercase; }
  .score-band { font-family: 'Courier New', monospace; font-size: 10px; border-radius: 4px; padding: 2px 7px; font-weight: bold; letter-spacing: 0.5px; }
  .score-right { display: flex; align-items: center; gap: 8px; }
  .score-num { font-family: 'Courier New', monospace; font-size: 22px; font-weight: bold; }
  .score-chevron { font-family: 'Courier New', monospace; font-size: 11px; color: #bbb; transition: transform 0.2s; display: inline-block; }
  .score-card-body { margin-top: 14px; }
  .caveat-box { border: 1px dashed #d8d0c6; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; background: repeating-linear-gradient(-45deg, transparent, transparent 5px, rgba(0,0,0,0.015) 5px, rgba(0,0,0,0.015) 10px); }
  .caveat-text { font-family: 'Courier New', monospace; font-size: 10px; color: #888; letter-spacing: 0.3px; }
  .reasoning-bullet { display: flex; gap: 10px; margin-bottom: 8px; padding-left: 10px; }
  .reasoning-text { font-size: 13px; color: #555; line-height: 1.5; }
  .truth-note { font-family: 'Courier New', monospace; font-size: 9.5px; color: #aaa; margin-top: 10px; line-height: 1.6; letter-spacing: 0.3px; }

  /* ── Share section ── */
  .share-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; }
  .share-tabs { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; margin-bottom: 10px; }
  .share-tab { flex: 1; padding: 8px; background: transparent; border: none; font-family: 'Courier New', monospace; font-size: 9.5px; letter-spacing: 1px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .share-tab.active { background: #111; color: white; }
  .msg-preview { border: 1px dashed #d0c9c0; border-radius: 9px; padding: 13px 14px; margin-bottom: 10px; }
  .msg-preview-text { font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.8; color: #444; white-space: pre-wrap; }
  .msg-cta-line { font-weight: bold; color: #222; }
  .share-btn-row { display: flex; gap: 7px; margin-top: 8px; }
  .share-btn-sm { flex: 1; padding: 10px 6px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.5px; cursor: pointer; border: none; text-align: center; }
  .btn-wa { background: #25D366; color: white; }
  .btn-wa:hover { opacity: 0.88; }
  .btn-x  { background: #000; color: white; }
  .btn-x:hover { opacity: 0.82; }
  .btn-cl { background: transparent; color: var(--subtle); border: 1px solid var(--border) !important; }
  .btn-cl:hover { border-color: #aaa !important; }
  .btn-cl.success { color: var(--truth); border-color: var(--truth) !important; }
  .btn-img { background: transparent; color: var(--subtle); border: 1px solid var(--border) !important; }
  .btn-img:hover { border-color: #aaa !important; }

  /* ── Shared result intro banner ── */
  .shared-intro { background: #111; color: #fff; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; }
  .shared-intro-label { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 2px; color: #888; margin-bottom: 6px; }
  .shared-intro-heading { font-size: 15px; font-weight: bold; line-height: 1.4; margin-bottom: 10px; }
  .shared-intro-sub { font-family: 'Courier New', monospace; font-size: 11px; color: #aaa; line-height: 1.6; margin-bottom: 14px; }
  .btn-try { display: block; width: 100%; padding: 11px; background: #fff; color: #111; border: none; border-radius: 7px; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 1px; font-weight: bold; cursor: pointer; text-align: center; }
  .btn-try:hover { background: #f0ede8; }

  /* ── Re-run box ── */
  .rerun-box { background: #f8f7f4; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }

  /* ── Claim Check cards ── */
  .claim-checks-wrap { margin-bottom: 12px; }
  .claim-check-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; }
  .claim-verdict-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .claim-section-label { font-family: 'Courier New',monospace; font-size: 8px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
  .claim-verdict-badge { font-family: 'Courier New',monospace; font-size: 9px; letter-spacing: 1px; font-weight: bold; padding: 2px 8px; border-radius: 3px; }
  .cv-true         { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }
  .cv-false        { background:#fef2f2; color:#dc2626; border:1px solid #fca5a5; }
  .cv-misleading   { background:#fff7ed; color:#ea580c; border:1px solid #fed7aa; }
  .cv-contested    { background:#fefce8; color:#ca8a04; border:1px solid #fde68a; }
  .cv-unverifiable { background:#f9fafb; color:#888;    border:1px solid #e5e7eb; }
  .claim-text { font-style: italic; font-size: 13px; color: #333; margin-bottom: 6px; line-height: 1.5; }
  .claim-note { font-size: 12px; color: #666; line-height: 1.55; margin-bottom: 6px; }
  .claim-source-link { font-family: 'Courier New',monospace; font-size: 9px; color: var(--muted); text-decoration: none; letter-spacing: 0.3px; }
  .claim-source-link:hover { text-decoration: underline; }
  .claim-internal-note { font-family: 'Courier New',monospace; font-size: 9px; color: #bbb; letter-spacing: 0.3px; }

  /* ── Publisher profile ── */
  .publisher-profile { background: #f8f7f4; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; }
  .publisher-profile-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .publisher-profile-name { font-family: 'Courier New',monospace; font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .publisher-profile-tag { font-family: 'Courier New',monospace; font-size: 8px; letter-spacing: 1px; color: #bbb; }
  .publisher-scores { display: flex; gap: 14px; }
  .pub-score { display: flex; flex-direction: column; gap: 2px; }
  .pub-score-label { font-family: 'Courier New',monospace; font-size: 7.5px; letter-spacing: 1px; }
  .pub-score-val { font-family: 'Courier New',monospace; font-size: 14px; font-weight: bold; }
  .pub-score-diff { font-family: 'Courier New',monospace; font-size: 8px; }
  .publisher-note { font-family: 'Courier New',monospace; font-size: 9px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

  /* ── Instinct / celebration banners ── */
  .instinct-banner { background: #1a1a1a; color: #fff; border-radius: var(--radius); padding: 10px 16px; margin-bottom: 10px; font-family: 'Courier New',monospace; font-size: 11px; letter-spacing: 0.5px; }
  .good-journalism-banner { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius); padding: 10px 16px; margin-bottom: 10px; font-family: 'Courier New',monospace; font-size: 11px; color: #166534; letter-spacing: 0.3px; }

  /* ── Technique tags ── */
  .techniques-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .technique-tag { font-family: 'Courier New',monospace; font-size: 8.5px; letter-spacing: 0.8px; padding: 3px 8px; border-radius: 3px; font-weight: bold; }
  .technique-rb { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
  .technique-cb { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }

  /* ── Age warning ── */
  .age-warning { background: #fefce8; border: 1px solid #fde68a; border-radius: var(--radius); padding: 9px 14px; margin-bottom: 12px; font-family: 'Courier New',monospace; font-size: 10px; color: #854d0e; letter-spacing: 0.3px; line-height: 1.5; }

  /* ── Claim share button ── */
  .claim-share-btn { font-family: 'Courier New',monospace; font-size: 8px; letter-spacing: 0.8px; padding: 3px 8px; border-radius: 3px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; margin-left: auto; }
  .claim-share-btn:hover { border-color: #aaa; color: #555; }
  .claim-share-btn.copied { color: var(--truth); border-color: var(--truth); }

  /* ── Hall of Shame ── */
  .shame-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .shame-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; cursor: pointer; }
  .shame-card:hover { border-color: #dc2626; }
  .shame-card-pub { font-family: 'Courier New',monospace; font-size: 8px; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 3px; }
  .shame-card-hl { font-size: 12px; color: var(--text); line-height: 1.4; margin-bottom: 5px; font-style: italic; }
  .shame-card-scores { display: flex; gap: 10px; align-items: center; }
  .shame-rb-badge { font-family: 'Courier New',monospace; font-size: 9px; font-weight: bold; color: #dc2626; background: #fef2f2; border: 1px solid #fca5a5; padding: 1px 6px; border-radius: 3px; }

  /* ── Banners ── */
  .banner { border-radius: 8px; padding: 8px 14px; margin-bottom: 14px; }
  .banner-demo { background: #fffbeb; border: 1px solid #fcd34d; }
  .banner-demo p { font-family: 'Courier New', monospace; font-size: 10px; color: #92400e; letter-spacing: 0.5px; }
  .banner-screenshot { background: #f8faff; border: 1px dashed #cbd5e1; }
  .banner-screenshot p { font-family: 'Courier New', monospace; font-size: 10px; color: #64748b; letter-spacing: 0.5px; }
  .banner-error { background: #fef2f2; border: 1px solid #fca5a5; }
  .banner-error p { font-size: 13px; color: #dc2626; font-family: Georgia, serif; }

  /* ── Error state ── */
  .error-heading { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 1.5px; color: var(--rb); margin-bottom: 12px; text-align: center; }
  .error-body { font-size: 14px; color: #666; line-height: 1.65; text-align: center; margin-bottom: 24px; }

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const EDGE_URL      = 'https://qpisyykqmivljpsqleul.supabase.co/functions/v1/bs-detect';
const SUPABASE_URL  = 'https://qpisyykqmivljpsqleul.supabase.co';
const SUPABASE_ANON = 'sb_publishable_woWGWtBvw0FJJNaP7rC63A_y5ZSVBjp';

// ─── ROTATING TAGLINES ────────────────────────────────────────────────────────
const TAGLINES = [
  'Because headlines lie.',
  "The internet's least popular fact-checker.",
  'No agenda. No advertisers. No mercy.',
  'Read everything. Trust nothing.',
  'Scoring the signal from the noise.',
  'Content Integrity · Est. 2026',
];
let taglineTimer = null;

function startTaglineCycle() {
  if (taglineTimer) return;
  taglineTimer = setInterval(() => {
    state.taglineIndex = (state.taglineIndex + 1) % TAGLINES.length;
    const el = document.getElementById('tagline-text');
    if (!el) return;
    el.style.opacity = '0';
    setTimeout(() => {
      const el2 = document.getElementById('tagline-text');
      if (el2) { el2.textContent = TAGLINES[state.taglineIndex]; el2.style.opacity = '1'; }
    }, 350);
  }, 3800);
}

// ─── WEAPONS GRADE LABELS ──────────────────────────────────────────────────────
function getWeaponLabel(type, score) {
  if (type === 'ragebait') {
    if (score >= 85) return { label: 'WEAPONS GRADE',      color: '#dc2626' };
    if (score >= 65) return { label: 'ENGINEERED OUTRAGE',color: '#ea580c' };
    if (score >= 45) return { label: 'EMOTIONALLY CHARGED',color:'#ca8a04' };
    return null;
  }
  if (type === 'clickbait') {
    if (score >= 85) return { label: 'PURE CLICKBAIT',    color: '#dc2626' };

  }

    if (score <= 20) return { label: 'NO EVIDENCE',       color: '#dc2626' };
    if (score <= 40) return { label: 'UNSUBSTANTIATED',   color: '#ea580c' };
    if (score <= 55) return { label: 'PARTIAL EVIDENCE',  color: '#ca8a04' };
    return null;
  }

}
function getBiggestWeaponLabel(scores) {
  // Returns the single most dramatic label for share messages
  const rl = getWeaponLabel('ragebait',  scores.ragebait);
  const cl = getWeaponLabel('clickbait', scores.clickbait);
  const tl = getWeaponLabel('truth',     scores.truth);
  if (rl && scores.ragebait  >= 85) return rl.label;
  if (cl && scores.clickbait >= 85) return cl.label;
  if (rl && scores.ragebait  >= 65) return rl.label;
  if (tl && scores.truth     <= 20) return tl.label;
  if (cl && scores.clickbait >= 65) return cl.label;
  return null;
}

async function shareClaimCard(idx) {
  const cc = state.result && state.result.claim_checks && state.result.claim_checks[idx];
  if (!cc) return;
  const VERDICT_COLORS = { true:'#16a34a', false:'#dc2626', misleading:'#ea580c', contested:'#ca8a04', unverifiable:'#888' };
  const v = (cc.verdict||'unverifiable').toLowerCase();
  const col = VERDICT_COLORS[v] || '#888';
  const label = (v === 'true' ? 'TRUE' : v === 'false' ? 'FALSE' : v.toUpperCase());

  const DPR=2, W=520, H=260;
  const canvas = document.createElement('canvas');
  canvas.width=W*DPR; canvas.height=H*DPR;
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR,DPR);

  ctx.fillStyle='#f5f0e8'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#c8bfb0'; ctx.lineWidth=1;
  ctx.strokeRect(12,12,W-24,H-24);
  ctx.fillStyle='#111'; ctx.fillRect(12,12,W-24,36);
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 10px "Courier New",monospace';
  ctx.fillText('THE BULLSHIT DETECTOR — CLAIM CHECK', W/2, 35);

  // Verdict badge
  ctx.fillStyle=col; ctx.fillRect(24,62,100,26);
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 10px "Courier New",monospace';
  ctx.fillText(label, 74, 80);

  // Claim text
  ctx.fillStyle='#1a1208'; ctx.textAlign='left'; ctx.font='italic 13px Georgia,serif';
  wrapText(ctx, `"${cc.claim}"`, 24, 110, W-48, 20);

  // Note
  if (cc.note) {
    ctx.fillStyle='#666'; ctx.font='11px "Courier New",monospace';
    wrapText(ctx, cc.note, 24, 160, W-48, 17);
  }

  // Source
  const src = cc.source ? `Verified by ${cc.source}` : 'Claude knowledge assessment';
  ctx.fillStyle='#aaa'; ctx.font='9px "Courier New",monospace'; ctx.textAlign='left';
  ctx.fillText(src, 24, H-30);
  ctx.textAlign='right';
  ctx.fillText('thescientificoracle.github.io/bullshit-detector/', W-24, H-30);

  try {
    const blob = await new Promise(res => canvas.toBlob(res,'image/png'));
    const file = new File([blob],'bsd-claim.png',{type:'image/png'});
    if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file], text:`CLAIM CHECK: ${label}\n\n"${cc.claim}"\n\n${cc.note||''}\n\nthescientificoracle.github.io/bullshit-detector/`});
      return;
    }
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='bsd-claim.png'; a.click();
  } catch {}
}

// ─── RADAR CHART ──────────────────────────────────────────────────────────────
function renderRadar(scores, screenshotMode) {
  const cx = 170, cy = 135, r = 90;
  const PI = Math.PI;
  const TRUTH_A = -PI / 2;
  const CB_A    = -PI / 2 + (2 * PI) / 3;
  const RB_A    = -PI / 2 + (4 * PI) / 3;

  function pt(a, radius) {
    const rad = (radius === undefined) ? r : radius;
    return { x: cx + rad * Math.cos(a), y: cy + rad * Math.sin(a) };
  }
  function clamp(v) { return Math.max(0, Math.min(100, v || 0)); }

  const truthAxis = pt(TRUTH_A), cbAxis = pt(CB_A), rbAxis = pt(RB_A);
  const dT  = pt(TRUTH_A, r * clamp(scores.truth)    / 100);
  const dCB = pt(CB_A,    r * clamp(scores.clickbait) / 100);
  const dRB = pt(RB_A,    r * clamp(scores.ragebait)  / 100);

  function gridPoly(pct) {
    const t = pt(TRUTH_A, r * pct / 100);
    const c = pt(CB_A,    r * pct / 100);
    const b = pt(RB_A,    r * pct / 100);
    return `${t.x},${t.y} ${c.x},${c.y} ${b.x},${b.y}`;
  }

  const rings = [20,40,60,80,100].map((p, i) =>
    `<polygon points="${gridPoly(p)}" fill="${i%2===0?'rgba(0,0,0,0.025)':'none'}" stroke="#d8d0c6" stroke-width="0.75" stroke-dasharray="3,2.5"/>`
  ).join('');

  const axes = `
    <line x1="${cx}" y1="${cy}" x2="${truthAxis.x}" y2="${truthAxis.y}" stroke="#d8d0c6" stroke-width="1" stroke-dasharray="3,2.5"/>
    <line x1="${cx}" y1="${cy}" x2="${cbAxis.x}"    y2="${cbAxis.y}"    stroke="#d8d0c6" stroke-width="1" stroke-dasharray="3,2.5"/>
    <line x1="${cx}" y1="${cy}" x2="${rbAxis.x}"    y2="${rbAxis.y}"    stroke="#d8d0c6" stroke-width="1" stroke-dasharray="3,2.5"/>`;

  const tLabel  = screenshotMode ? `~${scores.truth}`     : scores.truth;
  const cbLabel = screenshotMode ? `~${scores.clickbait}` : scores.clickbait;
  const tDash   = screenshotMode ? `<circle cx="${dT.x}"  cy="${dT.y}"  r="13" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="2.5,2" opacity="0.6"/>` : '';
  const cbDash  = screenshotMode ? `<circle cx="${dCB.x}" cy="${dCB.y}" r="13" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="2.5,2" opacity="0.6"/>` : '';
  const legend  = screenshotMode ? `<text x="${cx}" y="278" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="#999" letter-spacing="0.8">~ = INDICATIVE · SCREENSHOT MODE</text>` : '';

  return `<svg viewBox="0 0 320 285" style="width:100%;max-width:320px;display:block;margin:0 auto">
    ${rings}${axes}
    <polygon points="${dT.x},${dT.y} ${dCB.x},${dCB.y} ${dRB.x},${dRB.y}" fill="rgba(30,20,10,0.10)" stroke="#444" stroke-width="2" stroke-linejoin="round"/>
    ${tDash}<circle cx="${dT.x}"  cy="${dT.y}"  r="7" fill="white" stroke="#16a34a" stroke-width="2"/><circle cx="${dT.x}"  cy="${dT.y}"  r="3" fill="#16a34a"/>
    ${cbDash}<circle cx="${dCB.x}" cy="${dCB.y}" r="7" fill="white" stroke="#ea580c" stroke-width="2"/><circle cx="${dCB.x}" cy="${dCB.y}" r="3" fill="#ea580c"/>
    <circle cx="${dRB.x}" cy="${dRB.y}" r="7" fill="white" stroke="#dc2626" stroke-width="2"/><circle cx="${dRB.x}" cy="${dRB.y}" r="3" fill="#dc2626"/>
    <text x="${dT.x}"       y="${dT.y - 16}"  text-anchor="middle" font-family="'Courier New',monospace" font-size="11.5" fill="#16a34a" font-weight="bold">${tLabel}</text>
    <text x="${dCB.x + 15}" y="${dCB.y + 4}"  text-anchor="start"  font-family="'Courier New',monospace" font-size="11.5" fill="#ea580c" font-weight="bold">${cbLabel}</text>
    <text x="${dRB.x}"      y="${dRB.y - 14}" text-anchor="middle" font-family="'Courier New',monospace" font-size="11.5" fill="#dc2626" font-weight="bold">${scores.ragebait}</text>
    <text x="${truthAxis.x}" y="${truthAxis.y - 14}" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#16a34a" font-weight="bold" letter-spacing="1.2">TRUTH</text>
    <text x="${cbAxis.x}"   y="${cbAxis.y + 16}"   text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#ea580c" font-weight="bold" letter-spacing="1.2">CLICKBAIT</text>
    <text x="${rbAxis.x}"   y="${rbAxis.y + 16}"   text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#dc2626" font-weight="bold" letter-spacing="1.2">RAGEBAIT</text>
    ${(()=>{
      const wlRB = getWeaponLabel('ragebait',  scores.ragebait);
      const wlCB = getWeaponLabel('clickbait', scores.clickbait);
      const wlT  = getWeaponLabel('truth',     scores.truth);
      let stamps = '';
      if (wlRB) stamps += `<text x="${rbAxis.x}" y="${rbAxis.y + 27}" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="${wlRB.color}" font-weight="bold" letter-spacing="0.8">${wlRB.label}</text>`;
      if (wlCB) stamps += `<text x="${cbAxis.x}" y="${cbAxis.y + 27}" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="${wlCB.color}" font-weight="bold" letter-spacing="0.8">${wlCB.label}</text>`;
      if (wlT)  stamps += `<text x="${truthAxis.x}" y="${truthAxis.y - 24}" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="${wlT.color}" font-weight="bold" letter-spacing="0.8">${wlT.label}</text>`;
      return stamps;
    })()}
    ${legend}
  </svg>`;
}

const SCREENSHOT_PHASES = ['Reading screenshots…','Identifying publication…','Analysing content…','Scoring ragebait signals…','Cross-referencing sources…','Writing verdict…'];

function startPhases(isScreenshot) {
  clearInterval(phaseTimer);
  const phases = isScreenshot ? SCREENSHOT_PHASES : URL_PHASES;
  state.phaseIndex = 0;
  phaseTimer = setInterval(() => {
    state.phaseIndex = (state.phaseIndex + 1) % phases.length;
    const el = document.getElementById('phase-text');
    if (el) el.textContent = phases[state.phaseIndex];
    else clearInterval(phaseTimer);
  }, 900);

}

// ─── VERDICT ANIMATION ────────────────────────────────────────────────────────
function animateVerdict() {
  const el = document.getElementById('verdict-animated');
  if (!el || !state.result) return;
  const verdict = state.result.verdict;
  const words = verdict.split(' ');
  el.innerHTML = '';
  words.forEach((word, i) => {
    const span = document.createElement('span');
    span.textContent = word + (i < words.length - 1 ? ' ' : '');
    span.style.cssText = `opacity:0;transition:opacity 0.28s ease ${(i * 0.065).toFixed(2)}s`;
    el.appendChild(span);
  });
  const totalMs = ((words.length - 1) * 0.065 + 0.28 + 0.1) * 1000;
  requestAnimationFrame(() =>
    requestAnimationFrame(() => {
      el.querySelectorAll('span').forEach(s => s.style.opacity = '1');
      // After animation finishes, revert to plain text — prevents mobile browsers
      // resetting span opacity:0 when the element scrolls off-screen
      setTimeout(() => { if (el.isConnected) el.textContent = verdict; }, totalMs);
    })
  );
}

// ─── RESULT HASH (shareable URLs) ────────────────────────────────────────────
function encodeResult(result) {
  // Only encode the fields needed for a useful shared view — reasoning arrays make URLs enormous
  const slim = {
    headline:       result.headline,
    publication:    result.publication,
    publish_date:   result.publish_date || null,
    scores:         result.scores,
    verdict:        result.verdict,
    sourceUrl:      result.sourceUrl,
    screenshotMode: result.screenshotMode || false,
    // claim_checks intentionally omitted — they dominate URL length
  };
  // Use URL-safe base64 (no +, /, = chars) so links survive social platforms
  try {
    return btoa(unescape(encodeURIComponent(JSON.stringify(slim))))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  } catch { return null; }
}
function decodeResult(raw) {
  try {
    // URL-decode first (social platforms often encode hash chars like + → %2B)
    const decoded = decodeURIComponent(raw);
    // Convert URL-safe base64 back to standard, re-add padding
    let b64 = decoded.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch { return null; }
}
function setResultHash(result) {
  const encoded = encodeResult(result);
  if (encoded) history.replaceState(null, '', '#r=' + encoded);
}
function clearHash() {
  history.replaceState(null, '', location.pathname + location.search);
}

// ─── SHARE HELPERS ────────────────────────────────────────────────────────────
function buildShareMsg(r) {
  const weapon = getBiggestWeaponLabel(r.scores);
  const { truth, clickbait, ragebait } = r.scores;

  let hook;
  if      (weapon === 'WEAPONS GRADE')       hook = 'This is WEAPONS GRADE ragebait.';
  else if (weapon === 'ENGINEERED OUTRAGE')  hook = 'ENGINEERED OUTRAGE. Here\'s the receipt.';
  else if (weapon === 'PURE CLICKBAIT')      hook = 'This is PURE CLICKBAIT.';
  else if (truth >= 80 && ragebait <= 20)    hook = 'Actually solid journalism. Rare.';
  else if (truth <= 20)                      hook = 'Zero evidence. The Bullshit Detector found nothing.';
  else                                       hook = 'I ran this through the Bullshit Detector.';

  const scores = weapon
    ? `Ragebait: ${ragebait} — ${weapon}\nTruth: ${truth} · Clickbait: ${clickbait}`
    : `Truth: ${truth} · Clickbait: ${clickbait} · Ragebait: ${ragebait}`;

  const verdict = r.verdict ? `\n"${r.verdict}"` : '';
  return `${hook}\n\n${scores}${verdict}`;
}

async function shareResult() {
  const r = state.result;
  if (!r) return;

  const msg = buildShareMsg(r);
  const shareUrl = currentShareUuid
    ? `https://thescientificoracle.github.io/bullshit-detector/?v=${currentShareUuid}`
    : `https://thescientificoracle.github.io/bullshit-detector/`;
  const fullText = msg + '\n\n→ ' + shareUrl;

  let card;
  try { card = (_sharePreviewFor === r && _sharePreviewCache) ? _sharePreviewCache : await generateShareCard(r); }
  catch { return; }

  try {
    const blob = await new Promise(res => card.toBlob(res, 'image/png'));
    const file = new File([blob], 'bsd-result.png', { type: 'image/png' });

    // Mobile: native share sheet handles WhatsApp, LinkedIn, iMessage, Twitter etc. in one tap
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: fullText });
      return;
    }

    // Desktop: download image + copy full message to clipboard simultaneously
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bullshit-detector-result.png';
    a.click();
    try { await navigator.clipboard.writeText(fullText); } catch {}
    setState({ copiedBtn: 'share' });
    setTimeout(() => setState({ copiedBtn: null }), 3000);
  } catch { /* user cancelled — silent */ }
}
// ─── SHARE CARD (canvas) ──────────────────────────────────────────────────────
function drawRadarCard(ctx, cx, cy, r, scores) {
  const PI = Math.PI;
  const TA = -PI/2, CA = -PI/2 + 2*PI/3, RA = -PI/2 + 4*PI/3;
  const pt = (a, rad) => ({ x: cx + (rad??r)*Math.cos(a), y: cy + (rad??r)*Math.sin(a) });
  const cl = v => Math.max(0, Math.min(100, v||0));

  // Grid rings
  [20,40,60,80,100].forEach((p,i) => {
    const [t,c,b] = [TA,CA,RA].map(a => pt(a, r*p/100));
    ctx.beginPath(); ctx.moveTo(t.x,t.y); ctx.lineTo(c.x,c.y); ctx.lineTo(b.x,b.y); ctx.closePath();
    ctx.strokeStyle='#d8d0c6'; ctx.lineWidth=0.75; ctx.setLineDash([3,2.5]); ctx.stroke();
    if (i%2===0) { ctx.fillStyle='rgba(0,0,0,0.03)'; ctx.fill(); }
  });
  // Axes
  [TA,CA,RA].forEach(a => {
    const e=pt(a,r); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(e.x,e.y);
    ctx.strokeStyle='#d8d0c6'; ctx.lineWidth=1; ctx.setLineDash([3,2.5]); ctx.stroke();
  });
  ctx.setLineDash([]);

  // Data shape
  const dT=pt(TA,r*cl(scores.truth)/100), dC=pt(CA,r*cl(scores.clickbait)/100), dR=pt(RA,r*cl(scores.ragebait)/100);
  ctx.beginPath(); ctx.moveTo(dT.x,dT.y); ctx.lineTo(dC.x,dC.y); ctx.lineTo(dR.x,dR.y); ctx.closePath();
  ctx.fillStyle='rgba(30,20,10,0.12)'; ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.stroke();

  // Dots
  [[dT,'#16a34a'],[dC,'#ea580c'],[dR,'#dc2626']].forEach(([p,col]) => {
    ctx.beginPath(); ctx.arc(p.x,p.y,7,0,2*Math.PI); ctx.fillStyle='#f5f0e8'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,2*Math.PI); ctx.fillStyle=col; ctx.fill();
  });

  // Score numbers
  ctx.font='bold 13px "Courier New",monospace';
  ctx.fillStyle='#16a34a'; ctx.textAlign='center'; ctx.fillText(scores.truth, dT.x, dT.y-15);
  ctx.fillStyle='#ea580c'; ctx.textAlign='left';   ctx.fillText(scores.clickbait, dC.x+13, dC.y+5);
  ctx.fillStyle='#dc2626'; ctx.textAlign='right';  ctx.fillText(scores.ragebait, dR.x-13, dR.y+5);

  // Axis labels
  const [tPt,cPt,rPt] = [TA,CA,RA].map(a => pt(a,r));
  ctx.font='bold 9px "Courier New",monospace';
  ctx.fillStyle='#16a34a'; ctx.textAlign='center'; ctx.fillText('TRUTH',     tPt.x,   tPt.y-13);
  ctx.fillStyle='#ea580c'; ctx.textAlign='center'; ctx.fillText('CLICKBAIT', cPt.x,   cPt.y+16);
  ctx.fillStyle='#dc2626'; ctx.textAlign='center'; ctx.fillText('RAGEBAIT',  rPt.x,   rPt.y+16);
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(' '); let line = '';
  for (const w of words) {
    const test = line ? line+' '+w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); line=w; y+=lineH; }
    else { line=test; }
  }
  if (line) ctx.fillText(line, x, y);
  return y;
}

async function generateShareCard(result) {
  const DPR=2, W=640, H=400;
  const canvas = document.createElement('canvas');
  canvas.width=W*DPR; canvas.height=H*DPR;
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);

  const sc = result.scores;
  const weapon = getBiggestWeaponLabel(sc);

  // ── Background ──
  ctx.fillStyle='#f5f0e8'; ctx.fillRect(0,0,W,H);

  // Double border frame
  ctx.strokeStyle='#c8bfb0'; ctx.lineWidth=1;
  ctx.strokeRect(14,14,W-28,H-28);
  ctx.strokeStyle='#ddd6c8'; ctx.lineWidth=0.5;
  ctx.strokeRect(18,18,W-36,H-36);

  // ── Header strip ──
  ctx.fillStyle='#111'; ctx.fillRect(14,14,W-28,44);
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.font='bold 12px "Courier New",monospace';
  ctx.letterSpacing='3px';
  ctx.fillText('THE BULLSHIT DETECTOR', W/2, 41);
  ctx.letterSpacing='0px';

  // ── Left: Radar chart ──
  const radarCX=186, radarCY=232, radarR=100;
  drawRadarCard(ctx, radarCX, radarCY, radarR, sc);

  // ── Divider ──
  ctx.strokeStyle='#c8bfb0'; ctx.lineWidth=0.75; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(306,70); ctx.lineTo(306,H-30); ctx.stroke();
  ctx.setLineDash([]);

  // ── Right: Verdict + scores ──
  const rx=325;

  // Verdict
  if (result.verdict) {
    ctx.fillStyle='#1a1208'; ctx.textAlign='left';
    ctx.font='italic 15px Georgia,serif';
    const lastY = wrapText(ctx, `"${result.verdict}"`, rx, 88, W-rx-20, 23);
    // Rule after verdict
    ctx.strokeStyle='#ddd6c8'; ctx.lineWidth=0.75;
    ctx.beginPath(); ctx.moveTo(rx, lastY+14); ctx.lineTo(W-24, lastY+14); ctx.stroke();
  }

  // Score labels with weapon grades
  const scoreRows = [
    { label:'TRUTH',     score: sc.truth,     color:'#16a34a', type:'truth'     },
    { label:'CLICKBAIT', score: sc.clickbait, color:'#ea580c', type:'clickbait' },
    { label:'RAGEBAIT',  score: sc.ragebait,  color:'#dc2626', type:'ragebait'  },
  ];
  let sy = 260;
  for (const row of scoreRows) {
    const wl = getWeaponLabel(row.type, row.score);
    ctx.fillStyle=row.color; ctx.textAlign='left';
    ctx.font=`bold 11px "Courier New",monospace`;
    ctx.fillText(`${row.label}`, rx, sy);
    ctx.font=`bold 20px "Courier New",monospace`;
    ctx.fillText(`${row.score}`, rx+90, sy);
    if (wl) {
      ctx.font=`bold 9px "Courier New",monospace`;
      ctx.fillStyle = wl.color;
      ctx.fillText(wl.label, rx+130, sy);
    }
    sy += 30;
  }

  // ── Weapon stamp (if earned) ──
  if (weapon) {
    ctx.save();
    ctx.translate(W-60, 95);
    ctx.rotate(-0.35);
    ctx.strokeStyle='rgba(220,38,38,0.55)'; ctx.lineWidth=2.5;
    ctx.strokeRect(-50,-14,100,28);
    ctx.fillStyle='rgba(220,38,38,0.55)'; ctx.textAlign='center';
    ctx.font='bold 10px "Courier New",monospace';
    ctx.fillText(weapon, 0, 5);
    ctx.restore();
  }

  // ── Footer ──
  ctx.strokeStyle='#c8bfb0'; ctx.lineWidth=0.75;
  ctx.beginPath(); ctx.moveTo(14, H-30); ctx.lineTo(W-14, H-30); ctx.stroke();
  ctx.font='9px "Courier New",monospace'; ctx.fillStyle='#aaa'; ctx.textAlign='center';
  ctx.fillText('thescientificoracle.github.io/bullshit-detector/', W/2, H-14);

  return canvas;
}

// ─── DRAG AND DROP ────────────────────────────────────────────────────────────
function handleDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function handleDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  processFiles(files);
}

function processFiles(files) {
  let pending = files.length;
  files.forEach(file => {
    if (state.uploadedImages.length >= 8) { pending--; return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      state.uploadedImages = [...state.uploadedImages, { src: e.target.result, base64: e.target.result.split(',')[1], mType: file.type || 'image/jpeg' }];
      pending--;
      if (pending <= 0) render();
    };
    reader.readAsDataURL(file);
  });
}

// ─── API CALL ─────────────────────────────────────────────────────────────────
async function callEdge(body) {
  const res = await fetch(EDGE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON}`, 'apikey': SUPABASE_ANON },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

async function analyseUrl(url) {
  startPhases(false);
  setState({ screen: 'analysing', phaseIndex: 0, errorMsg: '', uploadedImages: [] });
  try {
    const result = await callEdge({ type: 'url', url });
    result.sourceUrl = url;
    stopPhases();
    setResultHash(result);
    incrementPersonalCount();
    storeAnalysis(result, 'url', url); // fire and forget
    pendingVerdictAnimation = true;
    setState({ screen: 'result', result, isDemo: false, openCard: null, isSharedResult: false, shareTab: 'short', copiedBtn: null });
  } catch (err) {
    stopPhases();
    console.error(err);
    setResultHash(HALL_OF_VERDICTS[0]);
    pendingVerdictAnimation = true;
    setState({ screen: 'result', result: HALL_OF_VERDICTS[0], isDemo: true, openCard: null, isSharedResult: false, shareTab: 'short', copiedBtn: null });
  }
}

async function analyseScreenshots(images) {
  startPhases(true);
  setState({ screen: 'screenshot-analysing', phaseIndex: 0, errorMsg: '' });
  try {
    const result = await callEdge({
      type: 'screenshot',
      images: images.map(img => ({ base64: img.base64, mediaType: img.mType || 'image/jpeg' })),
    });
    stopPhases();
    setResultHash(result);
    incrementPersonalCount();
    storeAnalysis(result, 'screenshot', null); // fire and forget
    pendingVerdictAnimation = true;
    setState({ screen: 'result', result, isDemo: false, openCard: null, isSharedResult: false, shareTab: 'short', copiedBtn: null });
  } catch (err) {
    stopPhases();
    console.error(err);
    setState({ screen: 'error', errorMsg: err.message });
  }
}

function loadHallResult(i) {
  const raw = HALL_OF_VERDICTS[i];

  const result = raw.source_url ? { ...raw, sourceUrl: raw.source_url } : raw;
  setResultHash(result);
  pendingVerdictAnimation = true;
  // Live verdicts are real analyses — show as demo=false so no demo banner
  setState({ screen: 'result', result, isDemo: !hallVerdictsLive, openCard: null, isSharedResult: false, shareTab: 'short', copiedBtn: null });
}

// ─── HANDLERS ─────────────────────────────────────────────────────────────────
function handleSubmit() {
  // If already on a blocker/format screen with screenshots ready, go straight to analysis
  if (['format', 'combined', 'access'].includes(state.screen) && state.uploadedImages.length > 0) {
    confirmScreenshots(); return;
  }
  const url = state.url.trim();
  if (!url) {
    if (state.uploadedImages.length > 0) { confirmScreenshots(); return; }
    return;
  }
  const fmt = detectFormat(url);
  const acc = detectAccess(url);

  if (fmt && !FORMAT_CAN_PROCEED.includes(fmt)) {
    setState({ screen: acc ? 'combined' : 'format', detectedFormat: fmt, detectedAccess: acc });
    return;
  }
  if (acc && !fmt) { setState({ screen: 'access', detectedFormat: null, detectedAccess: acc }); return; }
  if (acc && fmt && FORMAT_CAN_PROCEED.includes(fmt)) {
    setState({ screen: 'combined', detectedFormat: fmt, detectedAccess: acc });
    return;
  }
  analyseUrl(url);
}

function resetToInput() {
  stopPhases();
  clearHash();
  currentShareUuid = null;
  history.replaceState(null, '', location.pathname); // clear any ?v= param
  setState({ screen: 'input', result: null, detectedFormat: null, detectedAccess: null, errorMsg: '', uploadedImages: [], openCard: null, isDemo: false, shareTab: 'short', copiedBtn: null, isSharedResult: false });

}

// ─── PUBLISHER SCORECARDS ─────────────────────────────────────────────────────
async function fetchPublisherData() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/user_analyses?select=domain,publisher_name,truth_score,clickbait_score,ragebait_score&analysis_type=eq.url&domain=not.is.null&limit=2000`,
      { headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` } }
    );
    if (!res.ok) return {};
    const rows = await res.json();

    const grouped = {};
    for (const row of rows) {
      if (!row.domain) continue;
      if (!grouped[row.domain]) grouped[row.domain] = { count: 0, truth: 0, clickbait: 0, ragebait: 0, names: {} };
      grouped[row.domain].count++;
      grouped[row.domain].truth     += (row.truth_score     || 0);
      grouped[row.domain].clickbait += (row.clickbait_score || 0);
      grouped[row.domain].ragebait  += (row.ragebait_score  || 0);
      if (row.publisher_name) {
        grouped[row.domain].names[row.publisher_name] = (grouped[row.domain].names[row.publisher_name] || 0) + 1;
      }
    }

    const result = {};
    for (const [domain, d] of Object.entries(grouped)) {
      const topName = Object.entries(d.names).sort((a,b) => b[1]-a[1])[0]?.[0] || null;
      result[domain] = {
        count: d.count,
        t: Math.round(d.truth     / d.count),
        c: Math.round(d.clickbait / d.count),
        r: Math.round(d.ragebait  / d.count),
        name: topName,
      };
    }
    return result;
  } catch { return {}; }
}

function screenScorecards() {
  if (!publisherScorecardsData) {
    return `<div class="analysing-wrap">
      <div class="spinner"></div>
      <p class="phase-text">Loading publisher data…</p>
    </div>
    <button class="btn-back" onclick="resetToInput()">← Back</button>`;
  }

  const live = publisherScorecardsData;

  // Build merged list: every known publisher (hardcoded profiles + new domains from live data)
  const allDomains = new Set([...Object.keys(PUBLISHER_PROFILES), ...Object.keys(live)]);

  let entries = Array.from(allDomains).map(domain => {
    const profile = PUBLISHER_PROFILES[domain];
    const ld      = live[domain];
    // Use live averages if we have ≥3 analyses; otherwise use hardcoded profile as estimate
    if (ld && ld.count >= 3) {
      return { domain, name: ld.name || (profile && profile.name) || domain, t: ld.t, c: ld.c, r: ld.r, count: ld.count, isReal: true };
    } else if (profile) {
      return { domain, name: profile.name, t: profile.t, c: profile.c, r: profile.r, count: ld ? ld.count : 0, isReal: false };
    } else {
      // In live data but under threshold — show with real flag anyway
      return { domain, name: ld.name || domain, t: ld.t, c: ld.c, r: ld.r, count: ld.count, isReal: ld.count >= 1 };
    }
  });

  // Sort
  if (scorecardSortMode === 'ragebait')  entries.sort((a,b) => b.r - a.r);
  if (scorecardSortMode === 'truth')     entries.sort((a,b) => a.t - b.t);   // worst truth first
  if (scorecardSortMode === 'clickbait') entries.sort((a,b) => b.c - a.c);
  if (scorecardSortMode === 'count')     entries.sort((a,b) => b.count - a.count);

  const totalReal    = Object.values(live).reduce((s,d) => s + d.count, 0);
  const realPubCount = Object.values(live).filter(d => d.count >= 1).length;

  const subtitle = totalReal > 0
    ? `${fmtCount(totalReal)} real ${totalReal === 1 ? 'analysis' : 'analyses'} across ${realPubCount} publisher${realPubCount !== 1 ? 's' : ''}. Estimated = historical baseline.`
    : 'Showing historical baselines. Real data accumulates as articles are detected.';

  const sortBtns = ['ragebait','truth','clickbait','count'].map(m => {
    const active = scorecardSortMode === m;
    return `<button onclick="setScorecardSort('${m}')" style="font-family:'Courier New',monospace;font-size:9px;letter-spacing:0.8px;padding:4px 10px;border-radius:4px;cursor:pointer;border:1px solid ${active?'#333':'var(--border)'};background:${active?'#111':'transparent'};color:${active?'white':'var(--muted)'}">${m.toUpperCase()}</button>`;
  }).join('');

  const rows = entries.map(e => {
    const wl     = getWeaponLabel('ragebait', e.r);
    const rbCol  = e.r >= 65 ? '#dc2626' : e.r >= 45 ? '#ea580c' : 'var(--muted)';
    const tCol   = e.t >= 70 ? '#16a34a' : e.t >= 50 ? '#ca8a04' : '#dc2626';
    const cCol   = e.c >= 65 ? '#dc2626' : e.c >= 45 ? '#ea580c' : 'var(--muted)';

    const countTag = e.isReal && e.count > 0
      ? `<span style="font-family:'Courier New',monospace;font-size:8px;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:3px;padding:1px 5px;white-space:nowrap">${e.count} ${e.count === 1 ? 'analysis' : 'analyses'}</span>`
      : `<span style="font-family:'Courier New',monospace;font-size:8px;color:var(--muted);letter-spacing:0.3px">ESTIMATED</span>`;

    const weaponTag = (wl && e.r >= 65)
      ? `<span style="font-family:'Courier New',monospace;font-size:7.5px;font-weight:bold;color:${wl.color};background:${wl.color}15;border:1px solid ${wl.color}40;padding:2px 6px;border-radius:3px;white-space:nowrap">${wl.label}</span>`
      : '';

    return `<div style="background:white;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:7px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;gap:8px">
        <div style="min-width:0">
          <span style="font-family:'Courier New',monospace;font-size:10px;letter-spacing:1px;font-weight:bold;color:var(--text)">${e.name}</span>
          <span style="font-family:'Courier New',monospace;font-size:8px;color:var(--muted);margin-left:6px">${e.domain}</span>
        </div>
        ${countTag}
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div style="display:flex;flex-direction:column;gap:1px">
          <span style="font-family:'Courier New',monospace;font-size:7px;letter-spacing:1px;color:${tCol}">TRUTH</span>
          <span style="font-family:'Courier New',monospace;font-size:19px;font-weight:bold;color:${tCol}">${e.t}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:1px">
          <span style="font-family:'Courier New',monospace;font-size:7px;letter-spacing:1px;color:${cCol}">CLICKBAIT</span>
          <span style="font-family:'Courier New',monospace;font-size:19px;font-weight:bold;color:${cCol}">${e.c}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:1px">
          <span style="font-family:'Courier New',monospace;font-size:7px;letter-spacing:1px;color:${rbCol}">RAGEBAIT</span>
          <span style="font-family:'Courier New',monospace;font-size:19px;font-weight:bold;color:${rbCol}">${e.r}</span>
        </div>
        ${weaponTag ? `<div style="margin-left:auto;flex-shrink:0">${weaponTag}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  return `<div style="padding-bottom:8px">
    <p class="card-label" style="margin-bottom:4px">Publisher Scorecards</p>
    <p style="font-size:12.5px;color:var(--subtle);line-height:1.55;margin-bottom:14px">${subtitle}</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${sortBtns}</div>
    ${rows}
    <button class="btn-back" onclick="resetToInput()">← Back to detector</button>
  </div>`;
}

function renderScoreCard(type, result) {
  const score  = result.scores[type];

  const caveat    = result.screenshot_caveats && result.screenshot_caveats[type];
  const isShot    = result.screenshotMode;
  const scoreLabel = (isShot && type !== 'ragebait') ? `~${score}` : `${score}`;

    const bullets = reasons.map(r =>

    const note = type === 'truth' ? `<p class="truth-note">NOTE: Truth scoring reflects journalistic sourcing quality, not live fact-checking against external databases.</p>` : '';

const VERDICT_META = {
  true:         { label: 'TRUE',        cls: 'cv-true' },
  false:        { label: 'FALSE',       cls: 'cv-false' },
  misleading:   { label: 'MISLEADING',  cls: 'cv-misleading' },
  contested:    { label: 'CONTESTED',   cls: 'cv-contested' },
  unverifiable: { label: 'UNVERIFIED',  cls: 'cv-unverifiable' },
};

function renderClaimChecks(r) {
  if (!r.claim_checks || r.claim_checks.length === 0) return '';

  const cards = r.claim_checks.map((cc, idx) => {
    const v   = (cc.verdict || 'unverifiable').toLowerCase();
    const meta = VERDICT_META[v] || VERDICT_META.unverifiable;
    const sourceHtml = cc.source_url
      ? `<a class="claim-source-link" href="${cc.source_url}" target="_blank" rel="noopener">Source: ${cc.source || cc.source_url} ↗</a>`
      : (cc.confidence === 'high' || cc.confidence === 'medium')
        ? `<span class="claim-internal-note">Claude knowledge · ${cc.confidence} confidence</span>`
        : `<span class="claim-internal-note">Claude knowledge · low confidence · no external source found</span>`;

    return `<div class="claim-check-card">
      <div class="claim-verdict-row">
        <span class="claim-section-label">Claim check</span>
        <span class="claim-verdict-badge ${meta.cls}">${meta.label}</span>

      </div>
      <p class="claim-text">"${cc.claim}"</p>
      ${cc.note ? `<p class="claim-note">${cc.note}</p>` : ''}
      ${sourceHtml}
    </div>`;
  }).join('');

  return `<div class="claim-checks-wrap">${cards}</div>`;
}

    <p class="explainer-label">Three independent scores</p>
    ${[
      { color: '#16a34a', key: 'TRUTH',     desc: 'Evidentiary quality. How well-sourced are the claims? Starts at 100, deducted based on sourcing signals.' },
      { color: '#ea580c', key: 'CLICKBAIT', desc: 'Headline vs. body mismatch. Does the article deliver what the headline promises?' },
      { color: '#dc2626', key: 'RAGEBAIT',  desc: 'Emotional engineering. Is this content designed to provoke outrage, even if factually accurate?' },
    ].map(e => `<div class="explainer-row">
      <div class="explainer-bar" style="background:${e.color}"></div>
      <div><p class="explainer-title" style="color:${e.color}">${e.key}</p><p class="explainer-desc">${e.desc}</p></div>
    </div>`).join('')}
  </div>` : ''}`;
}

function screenAnalysing(isScreenshot) {
  const phases = isScreenshot ? SCREENSHOT_PHASES : URL_PHASES;
  return `<div class="analysing-wrap">
    <div class="spinner"></div>
    <p class="phase-text" id="phase-text">${phases[state.phaseIndex]}</p>
  </div>`;
}

function screenAccess() {
  const isPaywall = state.detectedAccess === 'paywall';
  const hashNote  = (!isPaywall && isHashUrl(state.url))
    ? `<p class="state-body-sm">This URL uses a hash-based identifier. A screenshot is the only option.</p>` : '';
  return `<div class="card">
    <span class="state-tag" style="background:${isPaywall?'#fef2f2':'#fff7ed'};color:${isPaywall?'#dc2626':'#ea580c'};border:1px solid ${isPaywall?'#fca5a5':'#fed7aa'}">
      ${isPaywall ? '🔒 Subscription paywall' : '🚧 Automated access blocked'}
    </span>
    <p class="state-body">${isPaywall
      ? "This one wants money before it'll talk. Screenshot the article and upload it below."
      : "This site keeps robots out. Screenshot the article and upload it below."}</p>
    ${hashNote}
  </div>
  <p class="explainer-label" style="margin-top:4px;margin-bottom:8px">UPLOAD SCREENSHOTS</p>
  ${renderUploadZone('Screenshot the article and upload it')}
  <br/><button class="btn-back" onclick="resetToInput()">← Try a different URL</button>`;
}

function screenFormat() {
  const fmt   = state.detectedFormat;
  const canGo = FORMAT_CAN_PROCEED.includes(fmt);
  const procBtn = canGo ? `<button class="btn-primary" style="margin-top:16px" onclick="analyseUrl(state.url)">ANALYSE ANYWAY</button>` : '';
  const upload  = !canGo ? `<p class="explainer-label" style="margin-top:16px;margin-bottom:8px">UPLOAD SCREENSHOTS</p>${renderUploadZone('Screenshot the content and upload it')}` : '';
  return `<div class="card">
    <span class="state-tag" style="background:#fff7ed;color:#ea580c;border:1px solid #fed7aa">⚠ ${FORMAT_LABELS[fmt] || 'Unsupported format'}</span>
    <p class="state-body">${FORMAT_MESSAGES[fmt] || ''}</p>
    ${procBtn}
  </div>
  ${upload}
  <button class="btn-back" onclick="resetToInput()">← Try a different URL</button>`;
}

function screenCombined() {
  const fmt = state.detectedFormat;
  const acc = state.detectedAccess;
  const tags = [
    fmt ? `<span class="state-tag" style="background:#fff7ed;color:#ea580c;border:1px solid #fed7aa">⚠ ${FORMAT_LABELS[fmt]}</span>` : '',
    acc ? `<span class="state-tag" style="background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;margin-left:6px">${acc==='paywall'?'🔒 Paywall':'🚧 Blocked'}</span>` : '',
  ].join('');
  return `<div class="card">
    <div style="margin-bottom:12px">${tags}</div>
    <p class="state-body">${FORMAT_MESSAGES[fmt] || ''}</p>
    <p class="state-body-sm">${acc==='paywall'
      ? "It's also paywalled. Screenshot it and upload below."
      : "It also keeps robots out. Screenshot it and upload below."}</p>
  </div>
  <p class="explainer-label" style="margin-top:4px;margin-bottom:8px">UPLOAD SCREENSHOTS</p>
  ${renderUploadZone('Screenshot the article and upload it')}
  <button class="btn-back" onclick="resetToInput()">← Try a different URL</button>`;
}

function screenResult() {
  const r = state.result;
  if (!r) return '';

  const demoBanner = state.isDemo
    ? `<div class="banner banner-demo"><p>EXAMPLE RESULT. Paste a real URL or upload screenshots for live analysis.</p></div>` : '';
  const ssBanner = r.screenshotMode
    ? `<div class="banner banner-screenshot"><p>SCREENSHOT MODE. Truth and Clickbait are indicative (~). Ragebait is most reliable.</p></div>` : '';
  const headline = r.headline ? `<p class="headline-quote">"${r.headline}"</p>` : '';
  const pub      = r.publication ? `<p class="publication-tag">${r.publication.toUpperCase()}</p>` : '';

  const rerunBox = (state.isSharedResult && r.sourceUrl)
    ? `<div class="rerun-box">
        <p class="card-label" style="margin-bottom:8px">Not convinced? Re-run it yourself</p>
        <div class="url-row" style="margin-bottom:0">
          <input class="url-input" type="url" value="${r.sourceUrl.replace(/"/g,'&quot;')}" style="font-size:12px;color:#888" readonly/>
          <button class="detect-btn" onclick="rerunShared()">DETECT</button>
        </div>
      </div>` : '';

  const personalCount = getPersonalCount();
  const personalLine  = personalCount > 0
    ? `You've run the detector ${personalCount} time${personalCount===1?'':'s'}.`
    : `${getCount().toLocaleString()} articles detected so far.`;
  // Publisher profile
  const pubProfile = (!state.isDemo && r.sourceUrl) ? renderPublisherProfile(r.sourceUrl, r.scores) : '';

  // Instinct / celebration banner
  let instinctBanner = '';
  if (r.scores.ragebait >= 75 && !state.isDemo)
    instinctBanner = `<div class="instinct-banner">Your instincts were right.</div>`;
  else if (r.scores.truth >= 80 && r.scores.ragebait <= 20 && r.scores.clickbait <= 25 && !state.isDemo)
    instinctBanner = `<div class="good-journalism-banner">Actually well-sourced. Rare.</div>`;

  // Age warning
  const ageWarning = (() => {
    if (!r.publish_date) return '';
    try {
      const pub = new Date(r.publish_date);
      const monthsOld = (Date.now() - pub.getTime()) / (1000 * 60 * 60 * 24 * 30);
      if (monthsOld >= 6) {
        const mo = Math.floor(monthsOld);
        return `<div class="age-warning">⚠ This article is ${mo} months old. Check why it's circulating again — old content being reshared is a common misinformation vector.</div>`;
      }
    } catch {}
    return '';
  })();

  // Technique labels
  const techniquesHtml = (!state.isDemo) ? renderTechniques(r) : '';

  const sharedWeapon = getBiggestWeaponLabel(r.scores);
  const sharedIntro = state.isSharedResult
    ? `<div class="shared-intro">
        <p class="shared-intro-label">SOMEONE RAN THIS THROUGH THE BULLSHIT DETECTOR</p>
        <p class="shared-intro-heading" style="font-size:22px;letter-spacing:-0.5px">${sharedWeapon ? sharedWeapon : `Ragebait: ${r.scores.ragebait}`}</p>
        <p class="shared-intro-sub">See their verdict below. Then run the article they sent you and find out if they're right.</p>
        <button class="btn-try" onclick="resetToInput()">PROVE THEM WRONG →</button>
      </div>` : '';

  return `${sharedIntro}${demoBanner}${ssBanner}${ageWarning}
  ${headline}${pub}
  ${pubProfile}
  ${instinctBanner}
  <div class="card">
    <p class="card-label">Verdict</p>
    <p class="verdict-quote" id="verdict-animated">${r.verdict}</p>
  </div>
  <div class="card" style="padding:16px">
    <p class="card-label" style="text-align:center;margin-bottom:10px">Content Fingerprint</p>
    ${renderRadar(r.scores, r.screenshotMode)}
  </div>
  ${techniquesHtml}
  ${r.reasoning ? `
  <p class="card-label" style="margin-bottom:10px">Breakdown - tap to expand</p>
  ${renderScoreCard('truth',     r)}
  ${renderScoreCard('clickbait', r)}
  ${renderScoreCard('ragebait',  r)}` : ''}
  ${renderClaimChecks(r)}
  ${rerunBox}
  ${renderShareSection(r)}
  <button class="btn-secondary" onclick="resetToInput()">${state.isSharedResult ? 'PROVE THEM WRONG — UPLOAD YOUR SCREENSHOT' : 'ANALYSE ANOTHER'}</button>`;
}

function screenError() {
  return `<p class="error-heading">ANALYSIS FAILED</p>
  <p class="error-body">The screenshot couldn't be read clearly enough to score. Try a cleaner one - the full article view works best.</p>
  <button class="btn-primary" onclick="resetToInput()">TRY AGAIN</button>`;
}

// ─── MAIN RENDER ──────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const s   = state.screen;
  let content = '';
  if      (s === 'input')                content = screenInput();
  else if (s === 'analysing')            content = screenAnalysing(false);
  else if (s === 'screenshot-analysing') content = screenAnalysing(true);
  else if (s === 'access')               content = screenAccess();
  else if (s === 'format')               content = screenFormat();
  else if (s === 'combined')             content = screenCombined();
  else if (s === 'result')               content = screenResult();
  else if (s === 'error')                content = screenError();
  else if (s === 'scorecards')           content = screenScorecards();

  app.innerHTML = renderMasthead(s !== 'input') + content;

  if (pendingVerdictAnimation && s === 'result') {
    pendingVerdictAnimation = false;
    requestAnimationFrame(() => animateVerdict());
  }
  if (s === 'result') requestAnimationFrame(refreshSharePreview);
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
(function boot() {
  // Check for ?v=UUID — shareable result link stored in Supabase
  const vParam = new URLSearchParams(location.search).get('v');
  if (vParam) {
    render(); // show input screen briefly while fetching
    loadRecentResult(vParam);
    fetchLiveCount();
    return;
  }

  const hash = location.hash;
  if (hash.startsWith('#r=')) {
    const decoded = decodeResult(hash.slice(3));
    if (decoded && decoded.scores) {
      state.result         = decoded;
      state.screen         = 'result';
      state.isDemo         = false;
      state.isSharedResult = true;
      if (decoded.sourceUrl) state.url = decoded.sourceUrl;
      pendingVerdictAnimation = true;
    }
  }
  render();
  // Fetch today's live verdicts in background — re-renders home screen when ready
  fetchDailyVerdicts();
  // Fetch real analysis count — replaces fake counter when loaded
  fetchLiveCount();
  // Fetch recent analyses for live feed
  fetchRecentAnalyses();
})();
</script>
</body>
</html>
